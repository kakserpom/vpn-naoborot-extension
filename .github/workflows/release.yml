# Релиз: собирает и подписывает CRX, публикует GitHub Release.
#
# Запуск: push тега вида v5.0.9. Версия в манифесте берётся из тега.
# Ключ подписи берётся из секрета CRX_PEM — это base64 содержимого
# crx-key.pem, он должен быть задан в настройках репозитория.
#
#   Секрет из локального ключа:  base64 -i crx-key.pem | pbcopy
#
# Ключ фиксирует ID расширения, поэтому он не хранится в репозитории.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Ключ подписи из секрета
        env:
          CRX_PEM: ${{ secrets.CRX_PEM }}
        run: |
          if [ -z "$CRX_PEM" ]; then
            echo "::error::Секрет CRX_PEM не задан. Добавьте его в Settings → Secrets → Actions (base64 содержимого crx-key.pem)."
            exit 1
          fi
          printf '%s' "$CRX_PEM" | base64 --decode > crx-key.pem

      - name: Версия из тега
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Сборка (Chrome-манифест)
        run: npm run build

      - name: Упаковка CRX
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome)"
          CHROME="$CHROME" npm run pack:crx

      - name: Переименование CRX
        run: mv dist.crx "VPN Наоборот – ВПН с российским IP ${GITHUB_REF_NAME#v}.crx"

      - name: Сборка Firefox-сборки
        run: npm run build:firefox

      - name: Архив Firefox
        run: |
          rm -f crx-key.pem
          (cd dist && zip -qr "../vpn-naoborot-firefox-${GITHUB_REF_NAME#v}.zip" .)

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            VPN Наоборот – ВПН с российским IP *
            vpn-naoborot-firefox-*
          generate_release_notes: true
          body: |
            ## Установка в Chrome
            1. Скачайте `VPN Наоборот – ВПН с российским IP …crx`
            2. Откройте `chrome://extensions`
            3. Перетащите CRX-файл на страницу расширений

            ## Установка в Firefox
            1. Скачайте архив `vpn-naoborot-firefox-…zip` и распакуйте
            2. Откройте `about:debugging#/runtime/this-firefox`
            3. «Load Temporary Add-on…» → выберите `manifest.json` из архива

            Правки и тесты: см. README.
