# Релиз: собирает и подписывает CRX, публикует GitHub Release.
#
# Запуск: push тега вида v5.0.9. Версия в манифесте берётся из тега.
# Ключ подписи берётся из секрета CRX_PEM — это base64 содержимого
# crx-key.pem, он должен быть задан в настройках репозитория.
#
#   Секрет из локального ключа:  base64 -i crx-key.pem | pbcopy
#
# Ключ фиксирует ID расширения, поэтому он не хранится в репозитории.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # полная история нужна для changelog между тегами
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Ключ подписи из секрета
        env:
          CRX_PEM: ${{ secrets.CRX_PEM }}
        run: |
          if [ -z "$CRX_PEM" ]; then
            echo "::error::Секрет CRX_PEM не задан. Добавьте его в Settings → Secrets → Actions (base64 содержимого crx-key.pem)."
            exit 1
          fi
          printf '%s' "$CRX_PEM" | base64 --decode > crx-key.pem

      - name: Версия из тега
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Сборка (Chrome-манифест)
        run: npm run build

      - name: Упаковка CRX
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome)"
          CHROME="$CHROME" npm run pack:crx

      - name: Переименование CRX
        run: mv dist.crx "vpn-naoborot-${GITHUB_REF_NAME#v}.crx"

      - name: Архив Chrome (распакованный вариант)
        run: (cd dist && zip -qr "../vpn-naoborot-chrome-${GITHUB_REF_NAME#v}.zip" .)

      - name: Сборка Firefox-сборки
        run: npm run build:firefox

      - name: Архив Firefox
        run: |
          rm -f crx-key.pem
          (cd dist && zip -qr "../vpn-naoborot-firefox-${GITHUB_REF_NAME#v}.zip" .)

      - name: Заметки релиза
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## Установка"
            echo
            echo "**Chrome/Edge** (рекомендуется): распакуйте \`vpn-naoborot-chrome-$VERSION.zip\`,"
            echo "\`chrome://extensions\` → «Режим разработчика» → «Загрузить распакованное расширение»."
            echo "Перетаскивать CRX-файл не нужно: Chrome разрешает ставить CRX только из Chrome Web Store"
            echo "(иначе ошибка \`CRX_REQUIRED_PROOF_MISSING\`). CRX-файл в релизе — для публикации"
            echo "в Chrome Web Store и установки через корпоративную политику \`ExtensionInstallForcelist\`."
            echo
            echo "**Firefox**: \`about:debugging#/runtime/this-firefox\` → «Загрузить временное дополнение…»"
            echo "→ \`manifest.json\` из \`vpn-naoborot-firefox-$VERSION.zip\`."
            echo
            echo "## Изменения"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "$PREV_TAG..$GITHUB_REF_NAME" | sed 's/^/- /'
            else
              echo "- первый релиз"
            fi
          } > NOTES.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            "vpn-naoborot-$VERSION.crx" \
            "vpn-naoborot-chrome-$VERSION.zip" \
            "vpn-naoborot-firefox-$VERSION.zip"